general {


    # Ensure only one instance of hyprlock runs
    
    lock_cmd = pidof hyprlock || hyprlock
    
    # Trigger the lock screen right before the laptop suspends (when lid shuts)
    
    before_sleep_cmd = loginctl lock-session
    
    # Ensure the screen turns back on when you open the lid
    
    after_sleep_cmd = hyprctl dispatch dpms on

    
}

# No listeners included. 
# The screen will never dim, lock, or turn off on a timer while the lid is open.
