general {
    disable_loading_bar = true
    hide_cursor = true
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
}

# Terminal prompt text
label {
    monitor =
    text = cmd[update:1000] echo "$USER@0xarch:~$"
    color = rgba(255, 0, 0, 1.0)
    font_size = 14
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 40
    halign = center
    valign = center
}

# Large Clock
label {
    monitor =
    text = $TIME
    color = rgba(255, 0, 0, 1.0)
    font_size = 64
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 150
    halign = center
    valign = center
}

# Password Input Field
input-field {
    monitor =
    size = 250, 40
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(ff0000)
    inner_color = rgb(000000)
    font_color = rgb(ff0000)
    fade_on_empty = false
    placeholder_text = <i><span foreground="##aa0000">sudo auth</span></i>
    hide_input = false
    position = 0, -40
    halign = center
    valign = center
    
    # Removes rounded corners to match Waybar/Dunst
    rounding = 0
}
